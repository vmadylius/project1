name: CI/CD Pipeline

# Тригери для автоматичного запуску пайплайну
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  # Job для збірки та тестування
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # Крок 1: Отримання коду з репозиторію
      - name: Checkout repository
        uses: actions/checkout@v4

      # Крок 2: Налаштування Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # ================= ЗМІНА 3 =================
      # Крок 3: Чисте встановлення залежностей
      - name: Install dependencies
        run: npm install

      # ================= ЗМІНА 4 =================
      # Крок 4: Статичний аналіз коду лінтером
      - name: Run linter
        run: npm run lint